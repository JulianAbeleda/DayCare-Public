[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daycare"
version = "0.1.0"
description = "A dependency-light training stack for small local language models: tinygrad LoRA training, RLOO on tool turns, and a measurement harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "jinja2"]

[project.optional-dependencies]
# No `train` extra: the trainer is a tinygrad-arkey *checkout* selected with DAYCARE_TRAIN_TINYGRAD_PATH
# (docs/rl-training.md). Its pip install omits the `extra/` tree its own modules import.
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/JulianAbeleda/DayCare-Public"

[tool.setuptools.packages.find]
include = ["daycare*"]

[tool.setuptools.package-data]
"daycare.nursery" = ["*.sh"]
